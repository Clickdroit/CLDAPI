  editing: "§eYou are now in edit mode."
  saved: "§aInventory saved."

# HelpOp messages
helpop:
  sent: "§aYour message has been sent to staff."
  received: "§c[HelpOp] §f{player}: §e{message}"
  no_staff: "§cNo staff online."

