  host_required: "§cYou must be host to execute this command."
  host_added: "§a{player} §fis now host."
  host_removed: "§e{player} §fis no longer host."
  player_revived: "§a{player} §fhas been revived!"
  player_kicked: "§c{player} §fhas been kicked."
  game_force_started: "§eThe game has been force started."

# Day/Night cycle messages
